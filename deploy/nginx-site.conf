# Отдельный сайт KazBeef в уже установленном nginx (вариант Б в docs/DEPLOY.md). Другие сайты не меняются.
# 1) Замените kazbeef.example.kz на свой адрес и 3000 — на FRONTEND_PORT из .env.
# 2) sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/kazbeef
#    sudo ln -s /etc/nginx/sites-available/kazbeef /etc/nginx/sites-enabled/kazbeef
#    sudo nginx -t && sudo systemctl reload nginx
# 3) Сертификат: sudo certbot --nginx -d kazbeef.example.kz
server {
    listen 80;
    server_name kazbeef.example.kz;

    # документы базы знаний — до 50 МБ, несколько за раз
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ответ чата идёт потоком: без буферизации, иначе текст придёт одним куском в конце
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }
}
